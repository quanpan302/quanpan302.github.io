{% if page.image %}
  {% assign visual_image = page.image.path | default: page.image %}
  {% unless visual_image contains '://' %}
    {% assign visual_image = visual_image | relative_url %}
  {% endunless %}
  <figure class="post-visual">
    <img src="{{ visual_image | escape }}" alt="{{ page.image.alt | default: page.title | escape }}" width="960" height="540">
    {% if page.image.caption %}<figcaption>{{ page.image.caption | escape }}</figcaption>{% endif %}
  </figure>
{% endif %}
