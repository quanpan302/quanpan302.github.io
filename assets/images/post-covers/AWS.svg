<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img" aria-labelledby="title desc">
<title id="title">AWS: regional services and availability zones</title><desc id="desc">A conceptual region contains two availability zones with compute instances behind a load balancer. Shared object storage is outside the zone boxes. This is not a deployed AWS architecture.</desc>
