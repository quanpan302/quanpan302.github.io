<path d="M315 210V225H180V230M315 225H450V230M590 295H630" stroke="#ffcf7b" stroke-width="3" fill="none"/>
<g font-family="sans-serif" fill="#f4f8fc"><text x="40" y="62" font-size="32">AWS / design across availability zones</text><g font-size="21" text-anchor="middle"><text x="315" y="184">Load balancer</text><text x="180" y="272">Zone A</text><text x="180" y="318">EC2 compute</text><text x="450" y="272">Zone B</text><text x="450" y="318">EC2 compute</text><text x="692" y="271">S3</text><text x="692" y="305">Objects</text></g><text x="40" y="420" font-size="17">CONCEPTUAL CLOUD ARCHITECTURE · NOT A DEPLOYED SYSTEM</text></g>
