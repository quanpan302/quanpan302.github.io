<path d="M280 240H345M500 240H560M398 285L420 308L454 266" stroke="#ffcf7b" stroke-width="4" fill="none"/>
<g font-family="sans-serif" fill="#f4f8fc"><text x="40" y="62" font-size="32">TypeScript / make contracts explicit</text><g font-size="22" text-anchor="middle"><text x="160" y="184">Interfaces</text><text x="160" y="233">Union types</text><text x="160" y="283">Generics</text><text x="425" y="201">Static</text><text x="425" y="236">checker</text><text x="662" y="229">JavaScript</text><text x="662" y="270">Runtime</text></g><text x="40" y="420" font-size="17">TYPE-CHECKING SCHEMATIC · TYPES ARE ERASED, NOT RUNTIME CHECKS</text></g>
