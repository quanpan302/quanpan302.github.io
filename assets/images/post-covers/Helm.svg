<path d="M275 170L340 210M275 330L340 290M525 250H570" stroke="#ffcf7b" stroke-width="4"/>
<g font-family="sans-serif" fill="#f4f8fc"><text x="40" y="62" font-size="32">Helm / package a Kubernetes release</text><g font-size="22" text-anchor="middle"><text x="160" y="162">Chart</text><text x="160" y="195">Templates</text><text x="160" y="322">Values</text><text x="160" y="355">Configuration</text><text x="420" y="257">Render</text><text x="667" y="225">Release</text><text x="667" y="265">Resources</text><text x="667" y="303">Revision</text></g><text x="40" y="420" font-size="17">PACKAGE WORKFLOW SCHEMATIC · INSTALL / UPGRADE / ROLLBACK</text></g>
