<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img" aria-labelledby="title desc">
<title id="title">Helm: templates and values become a release</title><desc id="desc">Chart templates and configurable values combine in rendering. The resulting Kubernetes resources belong to a versioned release that can be upgraded or rolled back.</desc>
