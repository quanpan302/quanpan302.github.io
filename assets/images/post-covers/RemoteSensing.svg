<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img" aria-labelledby="title desc">
<title id="title">Remote sensing: observe without touching</title><desc id="desc">A satellite observes reflected energy from a schematic terrain surface illuminated by the sun. Its observations feed image processing. No real satellite track or measured spectrum is shown.</desc>
