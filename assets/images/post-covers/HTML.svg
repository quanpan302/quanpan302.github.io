<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img" aria-labelledby="title desc">
<title id="title">HTML: semantic structure becomes a document</title><desc id="desc">A document tree branches from body to header, main and footer, with article inside main. A page outline shows these semantic regions in the browser.</desc>
