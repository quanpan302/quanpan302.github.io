<g font-family="sans-serif" fill="#f4f8fc"><text x="40" y="62" font-size="32">HTML / structure with meaning</text><g font-size="21" text-anchor="middle"><text x="240" y="138">body</text><text x="100" y="250">header</text><text x="240" y="250">main</text><text x="385" y="250">footer</text><text x="240" y="350">article</text><text x="642" y="146">Header</text><text x="642" y="257">Article</text><text x="642" y="363">Footer</text></g><text x="40" y="420" font-size="17">DOCUMENT TREE SCHEMATIC · SEMANTIC REGIONS, NOT A SCREENSHOT</text></g>
