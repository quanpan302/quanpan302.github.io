<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img" aria-labelledby="title desc">
<title id="title">Javalin: a lightweight route handler</title><desc id="desc">A GET request for the root path is matched to a handler. Javalin's context carries the request and produces the Hello World result from the article example.</desc>
<rect width="800" height="450" fill="#102136"/>
<g font-family="sans-serif" fill="#f4f8fc"><text x="40" y="62" font-size="32">Javalin / a route and a context</text><text x="40" y="420" font-size="17">HELLO WORLD REQUEST FLOW · JAVA / KOTLIN WEB FRAMEWORK</text></g>
<g stroke="#64d9cb" stroke-width="3" fill="#1a3b51"><rect x="45" y="180" width="165" height="105" rx="12"/><path d="M275 155H500V310H275Z"/><rect x="565" y="180" width="190" height="105" rx="12"/></g>
<path d="M215 232H265L250 222M265 232L250 242M505 232H555L540 222M555 232L540 242" stroke="#ffcf7b" stroke-width="4" fill="none"/>
<g font-family="sans-serif" fill="#f4f8fc" font-size="23" text-anchor="middle"><text x="127" y="224">GET /</text><text x="127" y="255">port 7000</text><text x="387" y="195">Route handler</text><text x="387" y="241">ctx</text><text x="387" y="282">result(...)</text><text x="660" y="243">Hello World</text><text x="387" y="365">Context: request + response</text></g>
