<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img" aria-labelledby="title desc">
<title id="title">ES2015: new tools for JavaScript expression</title><desc id="desc">Four syntax cards show arrow functions, classes, modules and promises. These are illustrative language features introduced in ECMAScript 2015.</desc>
<rect width="800" height="450" fill="#102136"/>
<g fill="#1a3b51" stroke="#64d9cb" stroke-width="3"><rect x="60" y="115" width="315" height="115" rx="12"/><rect x="425" y="115" width="315" height="115" rx="12"/><rect x="60" y="270" width="315" height="115" rx="12"/><rect x="425" y="270" width="315" height="115" rx="12"/></g>
<g font-family="monospace" fill="#ffcf7b" font-size="22"><text x="85" y="198">x =&gt; x + 1</text><text x="450" y="198">class Shape {}</text><text x="85" y="353">export / import</text><text x="450" y="353">Promise.then(...)</text></g>
<g font-family="sans-serif" fill="#f4f8fc"><text x="40" y="62" font-size="32">ES2015 / a richer language toolkit</text><g font-size="23"><text x="85" y="155">Arrows</text><text x="450" y="155">Classes</text><text x="85" y="310">Modules</text><text x="450" y="310">Promises</text></g><text x="40" y="420" font-size="17">LANGUAGE FEATURE CARDS · ILLUSTRATIVE SYNTAX</text></g>
