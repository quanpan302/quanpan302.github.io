<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img" aria-labelledby="title desc">
<title id="title">BDD: shared examples become specifications</title><desc id="desc">Business, development and QA contribute to one behavior specification. Given defines context, When defines action and Then defines the expected outcome.</desc>
